<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      color: #e5e7eb;
      background: #0d1117;
      font: 15px "Segoe UI", system-ui, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }
    .splash { display: grid; justify-items: center; gap: 18px; }
    img { width: 88px; height: 88px; }
    strong { font-size: 24px; letter-spacing: .08em; }
    .spinner {
      width: 24px; height: 24px; border: 3px solid #263244;
      border-top-color: #22d3ee; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <img src="logo.svg" alt="Audita">
    <strong>AUDITA</strong>
    <div class="spinner" aria-label="Loading"></div>
  </div>
</body>
</html>
